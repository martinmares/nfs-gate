apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-gate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-gate
  template:
    metadata:
      labels:
        app: nfs-gate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: nfs-gate
          image: nfs-gate:latest
          imagePullPolicy: IfNotPresent
          args: ["--root=/data", "--listen=:12049", "--health-listen=:8080"]
          ports:
            - name: nfs
              containerPort: 12049
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-gate
spec:
  selector:
    app: nfs-gate
  ports:
    - name: nfs
      port: 12049
      targetPort: nfs
      protocol: TCP
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
